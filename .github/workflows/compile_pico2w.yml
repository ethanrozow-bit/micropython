name: Build Custom Pico 2W Firmware
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Compiler Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential cmake python3

      - name: Build Cross-Compiler Tools
        run: |
          make -C mpy-cross

      - name: Compile Hardware Firmware Image
        run: |
          cd ports/rp2
          make BOARD=RPI_PICO2_W submodules
          make BOARD=RPI_PICO2_W clean
          make -j$(nproc) BOARD=RPI_PICO2_W

      - name: Upload Output Hardware Binary
        uses: actions/upload-artifact@v4
        with:
          name: Custom_Pico2W_Firmware
          path: ports/rp2/build-RPI_PICO2_W/firmware.uf2
